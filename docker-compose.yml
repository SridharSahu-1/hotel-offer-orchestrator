services:
  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    platform: linux/amd64
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_DB: temporal
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
      BIND_ON_IP: 0.0.0.0
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offer-task-queue
      SUPPLIER_BASE_URL: http://app:3000
      SUPPLIER_A_DOWN: "false"
      SUPPLIER_B_DOWN: "false"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    build: .
    platform: linux/amd64
    command: ["node", "dist/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offer-task-queue
      SUPPLIER_BASE_URL: http://app:3000
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      app:
        condition: service_started
